<div class="login-wrapper">
  <div class="login-box">
    <h2>User Login</h2>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="login-form">
      <input type="text" name="username" placeholder="Username or Email" [(ngModel)]="user.username" required class="form-input" />
      <input type="password" name="password" placeholder="Password"  [(ngModel)]="user.password" required class="form-input" />
      <button type="submit" [disabled]="!loginForm.valid" class="login-btn">Login</button>
    </form>

    <p class="signup-text">
      Don’t have an account?  <a [routerLink]="['/signup']">Sign Up</a>
    </p>
  </div>
</div>
